services:
  app:
    image: 172.16.0.3:5000/pool-site:1.2.4
    environment:
      NODE_ENV: production
      DB_USER: pool_site
      DB_NAME: pool_site
      DB_HOST: pg-ha-prod_haproxy
      POOL_SERVICE_API_URL: https://api.chauffagistes-btc.fr
      HOSTNAME: "0.0.0.0"
    secrets:
      - source: pool_site_prod_db_password
        target: db_password
      - source: pool_site_prod_api_key
        target: pool_site_api_key
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-prod
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pool-site.rule=Host(`chauffagistes-btc.fr`)"
        - "traefik.http.routers.pool-site.entrypoints=websecure"
        - "traefik.http.routers.pool-site.tls.certresolver=letsencrypt"
        - "traefik.http.services.pool-site.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-prod:
    external: true

secrets:
  pool_site_prod_db_password:
    external: true
  pool_site_prod_api_key:
    external: true