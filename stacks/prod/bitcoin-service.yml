version: "3.9"

services:
  app:
    image: 172.16.0.3:5000/bitcoin-service:1.1.0
    environment:
      SERVER_PORT: "8086"
      BITCOIN_NETWORK: "mainnet"
      BITCOIN_RPC_HOST: "192.168.1.204"
      BITCOIN_RPC_PORT: "8332"
      BITCOIN_RPC_USER: "bitcoinrpc"
      DB_HOST: pg-ha-prod_haproxy
      DB_USER: bitcoin_services
      DB_NAME: bitcoin_services
      SHOP_WEBHOOK_URL: http://miner-shop-prod_app:3000/api/internal/payments
      API_TOKEN_FILE: /run/secrets/api_token
      XPUB_FILE: /run/secrets/xpub
      BITCOIN_RPC_PASSWORD_FILE: /run/secrets/rpc_password
      SHOP_WEBHOOK_SECRET_FILE: /run/secrets/shop_webhook_secret
    secrets:
      - source: bitcoin_service_prod_db_password
        target: db_password
      - source: bitcoin_service_prod_api_token
        target: api_token
      - source: bitcoin_service_prod_xpub
        target: xpub
      - source: bitcoin_service_prod_rpc_password
        target: rpc_password
      - source: miner_shop_prod_payment_webhook_secret
        target: shop_webhook_secret
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-prod
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bitcoin-service.rule=Host(`bitcoin.chauffagistes-btc.fr`)"
        - "traefik.http.routers.bitcoin-service.entrypoints=websecure"
        - "traefik.http.routers.bitcoin-service.tls.certresolver=letsencrypt"
        - "traefik.http.services.bitcoin-service.loadbalancer.server.port=8086"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-prod:
    external: true

secrets:
  bitcoin_service_prod_db_password:
    external: true
  bitcoin_service_prod_api_token:
    external: true
  bitcoin_service_prod_xpub:
    external: true
  bitcoin_service_prod_rpc_password:
    external: true
  miner_shop_prod_payment_webhook_secret:
    external: true
