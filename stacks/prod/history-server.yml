services:
  app:
    image: 10.10.0.3:5000/history-server:1.0.3
    environment:
      - DB_HOST=pg-ha-prod-haproxy
      - DB_USER=postgres
      - DB_NAME=chauffagistes
      - PORT=8050
      - GATHER_STATS=true
    command: >
      sh -c "
      export DB_PASSWORD=$$(cat /run/secrets/history_server_db_password) &&
      export STATS_API_TOKEN=$$(cat /run/secrets/history_server_stats_api_token) &&
      python main.py"
    secrets:
      - source: history_server_prod_db_password
        target: history_server_db_password
      - source: history_server_prod_stats_api_token
        target: history_server_stats_api_token
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-prod
    deploy:
      placement:
        constraints:
          - node.labels.worload == true
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.history-server.rule=Host(`history.chauffagistes-btc.fr`)"
        - "traefik.http.routers.history-server.entrypoints=websecure"
        - "traefik.http.routers.history-server.tls.certresolver=letsencrypt"
        - "traefik.http.services.history-server.loadbalancer.server.port=8050"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-prod:
    external: true

secrets:
  history_server_prod_db_password:
    external: true
  history_server_prod_stats_api_token:
    external: true