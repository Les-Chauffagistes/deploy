services:
  app:
    image: 172.16.0.3:5000/history-server:1.1.0
    environment:
      - DB_HOST=pg-ha-prod_haproxy
      - DB_USER=history_server
      - DB_NAME=history_server
      - PORT=8050
      - GATHER_STATS=true
      - STATS_URL=https://api.chauffagistes-btc.fr
    command: >
      sh -c "
      export DB_PASSWORD=$$(cat /run/secrets/history_server_db_password) &&
      export STATS_API_TOKEN=$$(cat /run/secrets/pool_api_key) &&
      python main.py"
    secrets:
      - source: history_server_prod_db_password
        target: history_server_db_password
      - source: pool_api_prod_api_key
        target: pool_api_key
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-prod
    deploy:
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: any
        delay: 15s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.history-server.rule=Host(`history.chauffagistes-btc.fr`)"
        - "traefik.http.routers.history-server.entrypoints=websecure"
        - "traefik.http.routers.history-server.tls.certresolver=letsencrypt"
        - "traefik.http.services.history-server.loadbalancer.server.port=8050"

  db:
    image: timescale/timescaledb-ha:pg17@sha256:9665079bcf1403aa1751f4139acbb5dae6b458c7653dfd357acd4e7ae0973192
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=chauffagistes
      - POSTGRES_PASSWORD_FILE=/run/secrets/history_server_db_password
    secrets:
      - source: history_server_prod_db_password
        target: history_server_db_password
    networks:
      - history-server-internal
    ports:
      - target: 5432
        published: 5453
        protocol: tcp
    volumes:
      - history-server-pgdata:/home/postgres/pgdata/data
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chauffagistes"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.labels.chauffagistes.host == itrider
      update_config:
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s

volumes:
  history-server-pgdata:

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-prod:
    external: true
  history-server-internal:
    driver: overlay
    internal: true

secrets:
  history_server_prod_db_password:
    external: true
  pool_api_prod_api_key:
    external: true