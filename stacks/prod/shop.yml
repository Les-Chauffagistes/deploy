services:
  app:
    image: 10.10.0.3:5000/shop:1.1.1
    environment:
      NODE_ENV: production
      DB_USER: shop
      DB_NAME: shop
      DB_HOST: pg-ha-prod_haproxy
      HOSTNAME: "0.0.0.0"
      BASE_URL: shop.chauffagistes-btc.fr
      AUTH_URL: https://auth.chauffagistes-btc.fr
      AUTH_API_URL: https://api.auth.chauffagistes-btc.fr
      ADMIN_USER_IDS: 271, 90
    secrets:
      - source: shop_prod_db_password
        target: db_password
      - source: auth_prod_jwt_secret
        target: jwt_secret
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-prod
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.shop-prod.rule=Host(`shop.chauffagistes-btc.fr`)"
        - "traefik.http.routers.shop-prod.entrypoints=websecure"
        - "traefik.http.routers.shop-prod.tls.certresolver=letsencrypt"
        - "traefik.http.services.shop-prod.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-prod:
    external: true

secrets:
  shop_prod_db_password:
    external: true
  auth_prod_jwt_secret:
    external: true