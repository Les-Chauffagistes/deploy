services:
  app:
    image: 172.16.0.3:5000/miner-shop:1.0.0
    environment:
      PUBLIC_URL: https://miner-shop.chauffagistes-btc.fr
      AUTH_API_URL: https://api.auth.chauffagistes-btc.fr
      AUTH_FRONT_URL: https://auth.chauffagistes-btc.fr
      BACKOFFICE_USER_IDS: "90,92,88,271,272"
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PAYMENT_WEBHOOK_SECRET_FILE: /run/secrets/payment_webhook_secret
      PAYMENT_SERVICE_URL: http://bitcoin-prod_app:8086
      PAYMENT_SERVICE_TOKEN_FILE: /run/secrets/payment_service_token
    secrets:
      - source: miner_shop_prod_database_url
        target: database_url
      - source: auth_prod_jwt_secret
        target: jwt_secret
      - source: miner_shop_prod_payment_webhook_secret
        target: payment_webhook_secret
      - source: bitcoin_service_prod_api_token
        target: payment_service_token
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-prod
    # Le port d'écoute est 3000 (PORT, défaut de l'entrypoint). L'image n'embarque ni curl ni wget.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.miner-shop.rule=Host(`miner-shop.chauffagistes-btc.fr`)"
        - "traefik.http.routers.miner-shop.entrypoints=websecure"
        - "traefik.http.routers.miner-shop.tls.certresolver=letsencrypt"
        - "traefik.http.services.miner-shop.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-prod:
    external: true

secrets:
  miner_shop_prod_database_url:
    external: true
  miner_shop_prod_payment_webhook_secret:
    external: true
  auth_prod_jwt_secret:
    external: true
  bitcoin_service_prod_api_token:
    external: true
