services:
  api:
    image: ghcr.io/les-chauffagistes/heatcoin-service:0.0.0
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://heatcoin:DOCKER-SECRET@heatcoin-prod-db:5432/heatcoin
    secrets:
      - source: heatcoin_prod_db_password
        target: db_password
      - source: heatcoin_prod_api_key
        target: api_key
      - source: heatcoin_prod_jwt_secret
        target: jwt_secret
    networks:
      - chauffagistes-net          # joignable par les autres microservices
      - heatcoin-prod-internal     # communication avec postgres
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1"
          memory: 512M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heatcoin
      POSTGRES_USER: heatcoin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: heatcoin_prod_db_password
        target: db_password
    volumes:
      - heatcoin-prod-db-data:/var/lib/postgresql/data
    networks:
      - heatcoin-prod-internal     # postgres n'est PAS sur chauffagistes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatcoin"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == hugo     # db toujours sur la même machine pour la persistance
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  heatcoin-prod-db-data:

networks:
  chauffagistes-net:
    external: true
  heatcoin-prod-internal:
    driver: overlay
    internal: true  # pas de route vers l'extérieur

secrets:
  heatcoin_prod_db_password:
    external: true
  heatcoin_prod_api_key:
    external: true
  heatcoin_prod_jwt_secret:
    external: true