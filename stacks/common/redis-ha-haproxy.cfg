# HAProxy en TCP devant les 2 nœuds Redis. Le check envoie INFO replication et
# n'accepte que role:master : HAProxy ne route donc jamais vers un replica
# (écritures refusées en READONLY) et les applis parlent toujours au même Redis.
#
# Même logique que pg-ha-haproxy.cfg : résolution continue via le DNS Swarm,
# serveurs init-state down (HAProxy >= 3.1) tant que le premier check n'a pas
# réussi, et shutdown-sessions pour que les clients reconnectent au nouveau
# master dès la bascule (sinon ils resteraient collés à l'ancien, devenu replica).
global
    maxconn 1000

resolvers docker
    nameserver swarm 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    retries 2
    timeout client 1h
    timeout connect 2s
    timeout server 1h
    timeout check 2s

listen redis
    bind *:6379
    option tcp-check
    tcp-check connect
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none init-state down
    server redis1 redis1:6379 check
    server redis2 redis2:6379 check
