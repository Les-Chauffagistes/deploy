# HAProxy en TCP devant les 2 nœuds Patroni. Le check HTTP sur l'API REST
# Patroni (port 8008, /primary) ne répond 200 que sur le primaire : HAProxy
# ne route donc jamais vers un replica.
#
# Résolution via le DNS Swarm plutôt qu'au seul démarrage : db1/db2 ne sont
# publiés dans le DNS qu'une fois healthy, HAProxy doit pouvoir démarrer
# avant eux et suivre leurs changements d'adresse.
#
# init-state down (HAProxy >= 3.1) : un serveur n'est utilisé qu'après un
# premier check réussi. Sinon, un HAProxy qui (re)démarre envoie brièvement
# des requêtes au replica (écritures refusées en read-only).
global
    maxconn 200

resolvers docker
    nameserver swarm 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen postgres
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none init-state down
    server db1 db1:5432 maxconn 100 check port 8008
    server db2 db2:5432 maxconn 100 check port 8008
