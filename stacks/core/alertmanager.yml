services:
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    configs:
      - source: alertmanager_conf_v2
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager-data:/alertmanager
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
      restart_policy:
        condition: on-failure

  # Reformate le webhook générique "slack" d'Alertmanager au format attendu
  # par un webhook Discord (Alertmanager n'a pas de receiver Discord natif).
  alertmanager-discord:
    # Pas de tag versionné publié par le mainteneur (dernier push 2022) — épinglé
    # par digest pour la reproductibilité plutôt que de suivre `latest`.
    # Image FROM scratch (aucun shell dedans) : impossible d'y injecter le
    # secret via un wrapper `sh -c export $(cat ...)` comme ailleurs dans ce
    # repo. Le binaire accepte le webhook en flag CLI direct (`-webhook.url`),
    # donc on passe par une interpolation Compose au moment du déploiement
    # (même mécanisme que TRAEFIK_DASHBOARD_AUTH dans core/traefik.yml),
    # alimentée par le secret GitHub Actions DISCORD_WEBHOOK_URL — pas par un
    # secret Docker Swarm ici.
    image: benjojo/alertmanager-discord@sha256:7d27cd8494b269fe592cf6a9d7f6bdf14ac628bba34c381dc43cf533eaa95158
    command:
      - "-webhook.url=${DISCORD_WEBHOOK_URL}"
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
      restart_policy:
        condition: on-failure

configs:
  # Les configs Swarm sont immuables : toute modification du contenu de
  # alertmanager.config.yaml doit s'accompagner d'un changement de nom ici
  # ET dans configs: du service alertmanager ci-dessus (sinon "only updates
  # to Labels are allowed" au déploiement). --prune nettoie l'ancien objet
  # devenu orphelin.
  alertmanager_conf_v2:
    file: ./alertmanager.config.yaml

volumes:
  alertmanager-data:

networks:
  chauffagistes-net:
    external: true
