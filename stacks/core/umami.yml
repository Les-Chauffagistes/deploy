services:
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    # L'image umami ne lit que DATABASE_URL/APP_SECRET en env brut (pas de
    # variante _FILE comme postgres) : on les construit ici depuis les secrets
    # Docker avant d'exec le script de démarrage d'origine. L'ENTRYPOINT de
    # l'image (docker-entrypoint.sh) reste en place, seul le CMD est remplacé.
    # La base vit sur le cluster Postgres HA prod (pg-ha-prod_haproxy).
    command: ["sh", "-c", "export DATABASE_URL=\"postgresql://umami:$$(cat /run/secrets/db_password)@pg-ha-prod_haproxy:5432/umami\" APP_SECRET=\"$$(cat /run/secrets/app_secret)\" && exec sh scripts/start-docker.sh"]
    environment:
      DATABASE_TYPE: postgresql
    secrets:
      - source: core_umami_db_password
        target: db_password
      - source: core_umami_app_secret
        target: app_secret
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-prod
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == vps
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.umami.rule=Host(`umami.${DOMAIN}`)"
        - "traefik.http.routers.umami.entrypoints=websecure"
        - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
        - "traefik.http.services.umami.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-prod:
    external: true

secrets:
  core_umami_db_password:
    external: true
  core_umami_app_secret:
    external: true
