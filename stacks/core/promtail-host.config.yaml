# Promtail dédié au journal systemd du nœud bitcoind (bitcoind), qui ne tourne
# pas en conteneur et n'est donc pas vu par le service discovery Docker du
# promtail global (promtail.config.yaml). Les logs fichiers de ckpool sont dans
# promtail-ckpool.config.yaml (ckpool peut tourner sur plusieurs nœuds).
#
# Pourquoi un service séparé plutôt que ces jobs dans le promtail `global` :
# /var/log/journal n'existe que sur ce nœud, et Swarm
# REJETTE une tâche dont un bind source est absent — le service global tombait
# alors à 1 réplica, sans autre symptôme qu'un `docker service ls` à 1/N, et on
# perdait les logs de tous les conteneurs des autres nœuds. L'option
# `bind: create_host_path: true` de la spec Compose ne rattrape pas le coup :
# elle n'est pas honorée par `docker stack deploy` (vérifié, moteur 26.1.5).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # bitcoind logue dans le journal systemd : on lit le journal local et on ne
  # garde que son unité.
  - job_name: bitcoind-journal
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__hostname"]
        target_label: node
      - source_labels: [unit]
        regex: 'bitcoind\.service'
        action: keep
