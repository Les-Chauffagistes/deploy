services:
  portainer:
    image: portainer/portainer-ce:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - "100.111.87.16:9443:9443"
    volumes:
      - portainer_data:/data
    networks:
      - portainer
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  agent:
    image: portainer/agent:lts
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - portainer
    deploy:
      mode: global
      restart_policy:
        condition: any

volumes:
  portainer_data:

networks:
  portainer:
    driver: overlay
    attachable: true
  traefik-public:
    external: true