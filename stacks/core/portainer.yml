services:
  portainer:
    image: portainer/portainer-ce:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify

    ports:
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host

    volumes:
      - portainer_data:/data

    networks:
      - portainer

    deploy:
      placement:
        constraints:
          - node.hostname == docker-swarm-node02

      restart_policy:
        condition: any

  agent:
    image: portainer/agent:lts

    environment:
      AGENT_CLUSTER_ADDR: tasks.agent

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

    networks:
      - portainer

    deploy:
      mode: global

      restart_policy:
        condition: any

volumes:
  portainer_data:

networks:
  portainer:
    driver: overlay
    attachable: true
