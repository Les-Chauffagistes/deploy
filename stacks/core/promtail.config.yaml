server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: swarm-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: swarm_service
      - source_labels: [__meta_docker_container_label_com_docker_swarm_task_name]
        target_label: swarm_task
      - source_labels: [__meta_docker_container_label_com_docker_stack_namespace]
        target_label: swarm_stack
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      - docker: {}
      # Les services Python émettent une ligne JSON par événement — on en extrait
      # le niveau pour compter des événements dans les règles d'alerte plutôt que
      # des lignes de texte (une stack trace ne fait plus gonfler le compte). Sur
      # une ligne non-JSON (ex: Next.js), ce stage échoue silencieusement et le
      # label "level" reste simplement absent.
      #
      # Deux formats coexistent pendant la migration vers le wrapper commun
      # chauff-cmn (voir chauff_cmn.logging) :
      #   - ancien module maison (src/modules/logger/logger.py, loguru
      #     serialize=True) : JSON imbriqué, niveau sous record.level.name
      #   - chauff-cmn : JSON plat, niveau sous level directement
      # Le stage template priorise le format plat s'il est présent, sinon
      # retombe sur l'imbriqué. À supprimer une fois les 5 services Python migrés.
      - json:
          expressions:
            level_nested: record.level.name
            level_flat: level
      - template:
          source: level
          template: '{{ if .level_flat }}{{ .level_flat }}{{ else }}{{ .level_nested }}{{ end }}'
      - labels:
          level:

  # bitcoind tourne en service systemd natif (pas un conteneur) sur le nœud
  # debian — ce job lit le journal local de chaque nœud (mode: global) mais
  # ne garde que l'unité bitcoind.service : sur les autres nœuds, qui ne
  # l'ont pas, le flux reste simplement vide.
  - job_name: bitcoind-journal
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__hostname"]
        target_label: node
      - source_labels: [unit]
        regex: 'bitcoind\.service'
        action: keep
