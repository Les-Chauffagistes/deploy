server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: swarm-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: swarm_service
      - source_labels: [__meta_docker_container_label_com_docker_swarm_task_name]
        target_label: swarm_task
      - source_labels: [__meta_docker_container_label_com_docker_stack_namespace]
        target_label: swarm_stack
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      - docker: {}
      # Les services Python (loguru serialize=True) émettent une ligne JSON par
      # événement — on en extrait le niveau pour compter des événements dans les
      # règles d'alerte plutôt que des lignes de texte (une stack trace ne fait
      # plus gonfler le compte). Sur une ligne non-JSON (ex: Next.js), ce stage
      # échoue silencieusement et le label "level" reste simplement absent.
      - json:
          expressions:
            level: record.level.name
      - labels:
          level:
