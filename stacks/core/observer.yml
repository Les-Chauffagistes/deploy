services:
  observer:
    image: 10.10.0.3:5000/observer:sha-cba0534
    command: >
      sh -c "
      export GITHUB_WEBHOOK_SECRET=$$(cat /run/secrets/github_webhook_secret) &&
      export GITHUB_TOKEN=$$(cat /run/secrets/github_token) &&
      exec node server.js"
    environment:
      GITHUB_ORG: Les-Chauffagistes
      GITHUB_REPOS: pool-site,heatboard,auth-service-back,auth-service-front,history-server,bitcoin-service
      GITHUB_REVALIDATE_SECONDS: 30
    secrets:
      - source: observer_github_webhook_secret
        target: github_webhook_secret
      - source: observer_github_token
        target: github_token
    configs:
      - source: observer_conf_v3
        target: /app/observer.config.yml
        mode: 0444
    networks:
      - traefik-public
      - chauffagistes-net
    deploy:
      replicas: 1
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.observer.rule=Host(`observer.chauffagistes-btc.fr`)"
        - "traefik.http.routers.observer.entrypoints=websecure"
        - "traefik.http.routers.observer.tls.certresolver=letsencrypt"
        - "traefik.http.services.observer.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true

secrets:
  observer_github_webhook_secret:
    external: true
  observer_github_token:
    external: true

configs:
  # Les configs Swarm sont immuables : toute modification du contenu de
  # observer.config.yaml doit s'accompagner d'un changement de nom ici
  # ET dans configs: du service observer ci-dessus (sinon "only updates
  # to Labels are allowed" au déploiement). --prune nettoie l'ancien objet
  # devenu orphelin.
  observer_conf_v3:
    file: ./observer.config.yaml