services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - chauffagistes-net
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.3"
          # 200M plafonnait : le working set de cAdvisor sur node02 a atteint la
          # limite (209,70 Mo sur 209,72) et il y était tué en boucle (exit 137),
          # d'où des dizaines de cibles distinctes qui tombaient chaque jour.
          memory: 400M
      restart_policy:
        condition: on-failure

networks:
  chauffagistes-net:
    external: true
