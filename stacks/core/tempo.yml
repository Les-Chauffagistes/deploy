services:
  tempo:
    image: grafana/tempo:2.10.0
    command: -config.file=/etc/tempo/tempo.yaml
    configs:
      - source: tempo_conf
        target: /etc/tempo/tempo.yaml
    volumes:
      - tempo-data:/var/tempo
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure

configs:
  tempo_conf:
    file: ./tempo.config.yaml

volumes:
  tempo-data:

networks:
  chauffagistes-net:
    external: true
