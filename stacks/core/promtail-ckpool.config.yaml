# Promtail des logs fichiers de ckpool, un par nœud portant une instance
# (mode: global, contrainte node.labels.ckpool == true — voir promtail-ckpool.yml).
# $NODE (hostname du nœud Swarm) alimente le label `node`, filtrable dans le
# dashboard ckpool.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ckpool, lui, redirige stdout/stderr vers des fichiers
  # (StandardOutput/StandardError=append:... dans son unit) plutôt que vers le
  # journal — le job ci-dessus ne le verrait jamais. On lit donc les fichiers ;
  # promtail étiquette chaque flux avec son nom de fichier automatiquement.
  - job_name: ckpool-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: ckpool
          node: ${NODE}
          __path__: /var/log/ckpool/*.log
          # stdout.log est la barre de statut que ckpool réécrit chaque seconde
          # avec \r et [2K : le fichier ne contient aucun saut de ligne (14 Mo
          # mesurés pour 0 ligne au sens de wc -l). Promtail le lisait donc en
          # entier sans qu'une seule ligne n'atteigne Loki, pour un coût CPU/RAM
          # bien réel. Tous les messages utiles sont dans ckpool.log.
          __path_exclude__: /var/log/ckpool/stdout.log
    pipeline_stages:
      # ckpool préfixe chaque ligne de son horodate, en heure locale du nœud
      # (Europe/Paris). Sans ce stage, les lignes portent l'heure d'ingestion :
      # correct en régime normal, mais au moindre rejeu (volume de positions
      # perdu) tout l'historique du fichier est réinjecté estampillé
      # « maintenant ». Avec l'horodate réelle, un rejeu produit des doublons
      # exacts, que Loki écarte (au-delà d'une heure il les refuse même avec
      # « entry too far behind » : bruyant dans les logs de promtail, mais sans
      # pollution des données).
      - regex:
          expression: '^\[(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\]'
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05.000'
          location: Europe/Paris
