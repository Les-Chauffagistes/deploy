services:
  pypiserver:
    image: pypiserver/pypiserver:v2.3.0
    command:
      - run
      - -p
      - "8080"
      - -P
      - /data/auth/htpasswd
      - -a
      - update,download,list
      - /data/packages
    volumes:
      - pypiserver-packages:/data/packages
      - pypiserver-auth:/data/auth
    ports:
      - "10.10.0.3:8081:8080"
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pypiserver-packages:
  pypiserver-auth:

networks:
  chauffagistes-net:
    external: true
