services:
  youtrack:
    image: jetbrains/youtrack:2026.1.13559
    environment:
      # Base URL finale de l'instance — à ajuster avec ton domaine
      YOUTRACK_BASE_URL: https://youtrack.chauffagistes-btc.fr
    volumes:
      # Bind mounts vers les dossiers créés sur l'hôte
      # (volumes nommés incompatibles avec l'uid 13001)
      - /opt/youtrack/data:/opt/youtrack/data
      - /opt/youtrack/conf:/opt/youtrack/conf
      - /opt/youtrack/logs:/opt/youtrack/logs
      - /opt/youtrack/backups:/opt/youtrack/backups
    networks:
      - chauffagistes-net
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo  # à ajuster selon ta répartition
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: "2"
          memory: 2G        # YouTrack est gourmand, 2G minimum recommandé
        reservations:
          memory: 1G
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.youtrack.rule=Host(`youtrack.chauffagistes-btc.fr`)"
        - "traefik.http.routers.youtrack.entrypoints=websecure"
        - "traefik.http.routers.youtrack.tls.certresolver=letsencrypt"
        - "traefik.http.services.youtrack.loadbalancer.server.port=8080"
        - "traefik.http.services.youtrack.loadbalancer.responseforwarding.flushinterval=1ms"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true