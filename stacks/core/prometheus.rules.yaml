# Règles d'alerte Prometheus — évaluées par Prometheus, envoyées à Alertmanager
# (core/alertmanager.yml) qui les relaie sur Discord.
groups:
  - name: swarm-containers
    rules:
      - alert: ContainerRestartLoop
        expr: resets(container_start_time_seconds{container_label_com_docker_swarm_service_name!=""}[10m]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Redémarrages répétés : {{ $labels.container_label_com_docker_swarm_service_name }}"
          description: "Le service Swarm {{ $labels.container_label_com_docker_swarm_service_name }} sur {{ $labels.instance }} a redémarré plus de 2 fois en 10 minutes."

      - alert: ServiceReplicasDown
        # swarm-services couvre tout service opt-in via les labels prometheus.scrape/port
        # (voir prometheus.config.yaml) — Garage y compris.
        expr: up{job=~"node-exporter|cadvisor|traefik|swarm-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cible injoignable : {{ $labels.job }} sur {{ $labels.instance }}"
          description: "Prometheus n'arrive plus à scraper {{ $labels.job }} ({{ $labels.instance }}) depuis 2 minutes — le nœud ou le service est probablement down."

  - name: swarm-resources
    rules:
      - alert: ContainerMemoryNearLimit
        # container_memory_working_set_bytes (pas usage_bytes) : usage_bytes inclut le
        # cache page du kernel (binaires mmap'és, .so, .pyc — réclamable sous pression
        # sans tuer le process), ce qui déclenchait de faux positifs sur des services
        # comme coins-service (moteur Prisma) alors que le working set réel restait
        # confortable. working_set_bytes = ce que Kubernetes utilise aussi pour juger
        # la pression mémoire réelle avant un OOM-kill.
        expr: |
          container_memory_working_set_bytes{container_label_com_docker_swarm_service_name!=""}
            / on(id) group_left(container_label_com_docker_swarm_service_name)
            (container_spec_memory_limit_bytes{container_label_com_docker_swarm_service_name!=""} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire proche de la limite : {{ $labels.container_label_com_docker_swarm_service_name }}"
          description: "{{ $labels.container_label_com_docker_swarm_service_name }} utilise plus de 90% de sa limite mémoire (working set) depuis 5 minutes — risque d'OOM-kill imminent."

      - alert: NodeDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"} < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque faible sur {{ $labels.node }}"
          description: "Moins de 10% d'espace disque restant sur {{ $labels.node }}."

      - alert: GarageDiskSpaceLow
        # garage_local_disk_avail/total : espace disque réel restant sous les
        # volumes data/meta, pas la capacité déclarée au layout (que Garage ne
        # fait pas respecter comme un quota dur) — c'est ce qui compte vraiment
        # pour anticiper un disque plein sur la cible de sauvegarde.
        expr: |
          garage_local_disk_avail / garage_local_disk_total < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque Garage faible ({{ $labels.volume }})"
          description: "Moins de 10% d'espace disque restant sur le volume {{ $labels.volume }} de Garage — les sauvegardes risquent d'échouer."

  - name: postgres-ha
    rules:
      - alert: PatroniNoPrimary
        expr: max by (scope) (patroni_primary) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Aucun primaire Postgres : {{ $labels.scope }}"
          description: "Le cluster Patroni {{ $labels.scope }} n'a plus de primaire depuis 1 minute : les écritures échouent."

      - alert: PatroniNoReplica
        expr: sum by (scope) (patroni_replica) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plus de replica Postgres : {{ $labels.scope }}"
          description: "Le cluster Patroni {{ $labels.scope }} n'a plus de replica depuis 10 minutes : la perte du nœud primaire ne serait plus rattrapée."

      - alert: PatroniReplicationLag
        # Position WAL du primaire moins position rejouée par chaque replica.
        expr: |
          max by (scope) (patroni_xlog_location)
            - on (scope) group_right()
          (patroni_xlog_replayed_location and on (scope, name) (patroni_replica == 1))
            > 64 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Retard de réplication : {{ $labels.scope }}/{{ $labels.name }}"
          description: "Le replica {{ $labels.name }} a plus de 64 Mo de WAL de retard sur le primaire depuis 10 minutes."

      - alert: PatroniFailsafeActive
        expr: max by (scope) (patroni_failsafe_mode_is_active) == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Patroni en failsafe : {{ $labels.scope }}"
          description: "{{ $labels.scope }} ne joint plus le quorum etcd et tient grâce au failsafe_mode. Vérifier etcd-dcs."
