# Règle d'alerte Loki (ruler intégré) — évaluée par Loki, envoyée au même
# Alertmanager que Prometheus (core/alertmanager.yml).
# Chemin imposé par le ruler en storage local + auth désactivé (tenant "fake") :
# /loki/rules/fake/<nom-de-fichier>.yml
groups:
  - name: application-errors
    rules:
      # Services avec logs JSON (loguru serialize=True, voir logger.py des services
      # Python) : le label "level" vient du stage `json` de promtail.config.yaml et
      # compte un événement par log réel. Une exception avec stack trace = 1 ligne
      # JSON = 1 événement, contrairement à l'ancienne règle texte qui comptait
      # chaque ligne de la trace comme une occurrence "error" séparée.
      #
      # Filtre `!~` : exclut du comptage les 404 générés par le scraping de
      # bots (tentatives de fetch de .env, .git/, wp-login, phpmyadmin, etc.)
      # que les middlewares applicatifs loggent en level=ERROR. Le log reste
      # en level=ERROR à la source (visible dans Grafana/Loki pour du debug),
      # seul le comptage utilisé pour l'alerte les ignore. Complète la regex
      # si de nouveaux patterns de scan apparaissent.
      - alert: HighErrorLogRate
        expr: |
          sum by (swarm_service) (count_over_time({swarm_service=~".+", level=~"ERROR|CRIT"} !~ `(?i)(\.env|\.git/|wp-(login|admin)|phpmyadmin|xmlrpc\.php|\.aws/credentials|\.ssh/id_rsa|vendor/phpunit)`[5m])) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Pic de logs error/crit sur {{ $labels.swarm_service }}"
          description: "Plus de 10 événements error/crit en 5 minutes pour {{ $labels.swarm_service }}."

      # Services pas encore migrés au JSON (Next.js : console.* brut). On garde
      # l'ancien comptage par ligne de texte, restreint aux flux sans label
      # "level" pour ne pas doubler-compter les services déjà structurés.
      #
      # core_registry est exclu : le handshake d'auth normal du protocole
      # Docker Registry V2 (requête sans credentials → 401 → retry avec
      # credentials, à chaque push) logue "error authorizing context: ...
      # invalid authorization credential" en level=warning. La regex matche
      # sur le texte brut de la ligne, pas sur le niveau, donc ce warning
      # attendu (un par layer/manifest poussé) était compté comme une
      # erreur et déclenchait une fausse alerte à chaque build CI. Les
      # vraies pannes du registre restent couvertes par
      # ContainerRestartLoop / ServiceReplicasDown.
      #
      # core_loki est exclu pour la même raison, en pire : Loki logue en
      # info chaque requête exécutée, y compris celles du ruler — et la
      # requête de HighErrorLogRateLegacy contient elle-même le texte
      # "error|fatal|crit". La regex finit par se matcher sur ses propres
      # logs de query à chaque évaluation, ce qui gonfle artificiellement
      # le compte indépendamment de toute vraie erreur applicative.
      # Même filtre anti-scan que HighErrorLogRate ci-dessus (voir commentaire).
      - alert: HighErrorLogRateLegacy
        expr: |
          sum by (swarm_service) (count_over_time({swarm_service=~".+", swarm_service!="core_registry", swarm_service!="core_loki", level=""} |~ `(?i)error|fatal|crit` !~ `(?i)(\.env|\.git/|wp-(login|admin)|phpmyadmin|xmlrpc\.php|\.aws/credentials|\.ssh/id_rsa|vendor/phpunit)`[5m])) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Pic de logs error/fatal sur {{ $labels.swarm_service }} (logs non structurés)"
          description: "Plus de 10 lignes error/fatal/crit en 5 minutes pour {{ $labels.swarm_service }} — service sans logs JSON, le seuil peut être atteint par une seule stack trace multi-lignes."

  # Sauvegardes barman-cloud des clusters pg-ha (voir stacks/*/pg-ha-entrypoint.sh).
  - name: postgres-backups
    rules:
      - alert: PgBackupFailed
        expr: |
          sum by (swarm_stack) (count_over_time({swarm_stack=~"pg-ha-.+"} |= "pg-ha-backup: FAILED" [30m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Échec de sauvegarde Postgres : {{ $labels.swarm_stack }}"
          description: "La sauvegarde complète quotidienne de {{ $labels.swarm_stack }} a échoué (voir les logs des services db1/db2)."

      - alert: PgWalArchiveFailed
        expr: |
          sum by (swarm_stack) (count_over_time({swarm_stack=~"pg-ha-.+"} |= "archive command failed" [15m])) > 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Archivage WAL en échec : {{ $labels.swarm_stack }}"
          description: "Postgres n'arrive plus à envoyer ses WAL vers Garage pour {{ $labels.swarm_stack }} : la restauration à un instant donné n'est plus garantie et pg_wal grossit."

      - alert: PgBackupMissingStaging
        expr: |
          absent_over_time({swarm_stack="pg-ha-staging"} |= "pg-ha-backup: OK" [26h])
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Pas de sauvegarde Postgres récente : pg-ha-staging"
          description: "Aucune sauvegarde complète réussie de pg-ha-staging depuis plus de 26 heures."
