services:
  prometheus:
    image: prom/prometheus:v2.55.1
    # group_add n'est pas supporté par docker stack deploy (SwarmKit).
    # Le user par défaut de l'image (nobody) n'a pas accès au socket monté
    # ci-dessous, nécessaire pour dockerswarm_sd_configs — on passe en root.
    user: "0:0"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    configs:
      - source: prometheus_conf
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/rules/rules.yml
    volumes:
      - prometheus-data:/prometheus
      # dockerswarm_sd_configs a besoin de l'API Swarm (liste des tasks/services
      # cluster-wide), disponible uniquement sur un nœud manager.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      restart_policy:
        condition: on-failure

configs:
  prometheus_conf:
    file: ./prometheus.config.yaml
  prometheus_rules:
    file: ./prometheus.rules.yaml

volumes:
  prometheus-data:

networks:
  chauffagistes-net:
    external: true
