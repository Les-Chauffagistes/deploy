services:
  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN}"
    configs:
      - source: grafana_datasources_v2
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_provider_v1
        target: /etc/grafana/provisioning/dashboards/provider.yml
      - source: grafana_dashboard_garage_v1
        target: /etc/grafana/provisioning/dashboards/garage.json
      - source: grafana_dashboard_bitcoind_v1
        target: /etc/grafana/provisioning/dashboards/bitcoind.json
    secrets:
      - source: core_grafana_admin_password
        target: grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - chauffagistes-net
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

configs:
  # Les configs Swarm sont immuables : tout changement de contenu de
  # grafana-datasources.yaml nécessite un nouveau nom ici (voir loki.yml
  # pour le même piège). --prune nettoie l'ancien objet devenu orphelin.
  grafana_datasources_v2:
    file: ./grafana-datasources.yaml
  # Provisioning des dashboards : le provider pointe sur son propre dossier de
  # montage, où chaque dashboard JSON est monté à côté (même piège d'immutabilité
  # que ci-dessus — bumper le nom au moindre changement de contenu).
  grafana_dashboards_provider_v1:
    file: ./grafana-dashboards.yaml
  grafana_dashboard_garage_v1:
    file: ./garage-dashboard.json
  grafana_dashboard_bitcoind_v1:
    file: ./bitcoind-dashboard.json

volumes:
  grafana-data:

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true

secrets:
  core_grafana_admin_password:
    external: true
