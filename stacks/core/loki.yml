services:
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki.yml
    configs:
      - source: loki_conf
        target: /etc/loki/loki.yml
      - source: loki_rules
        target: /loki/rules/fake/rules.yml
    volumes:
      - loki-data:/loki
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      resources:
        limits:
          cpus: "0.5"
          memory: 400M
      restart_policy:
        condition: on-failure

configs:
  loki_conf:
    file: ./loki.config.yaml
  loki_rules:
    file: ./loki.rules.yaml

volumes:
  loki-data:

networks:
  chauffagistes-net:
    external: true
