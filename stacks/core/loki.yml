services:
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki.yml
    configs:
      - source: loki_conf
        target: /etc/loki/loki.yml
      - source: loki_rules_v4
        target: /loki/rules/fake/rules.yml
    volumes:
      - loki-data:/loki
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      resources:
        limits:
          cpus: "0.5"
          memory: 400M
      restart_policy:
        condition: on-failure

configs:
  loki_conf:
    file: ./loki.config.yaml
  # Les configs Swarm sont immuables : tout changement de contenu de
  # loki.rules.yaml nécessite un nouveau nom ici ET dans configs: du service
  # loki ci-dessus (sinon "only updates to Labels are allowed" au déploiement).
  # --prune nettoie l'ancien objet devenu orphelin.
  loki_rules_v4:
    file: ./loki.rules.yaml

volumes:
  loki-data:

networks:
  chauffagistes-net:
    external: true
