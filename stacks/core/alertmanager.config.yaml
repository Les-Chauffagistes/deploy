route:
  group_by: ["alertname", "swarm_service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: discord

receivers:
  - name: discord
    # alertmanager-discord attend le JSON natif du webhook Alertmanager
    # (alerts[]/commonLabels/commonAnnotations...) et construit lui-même
    # l'embed Discord — ce n'est PAS un endpoint compatible Slack. Utiliser
    # slack_configs échoue silencieusement : le notifier Slack d'Alertmanager
    # exige un corps de réponse littéral "ok", que ce binaire ne renvoie
    # jamais (il répond 200 vide). webhook_configs se contente d'un 2xx.
    webhook_configs:
      - url: http://alertmanager-discord:9094/
        send_resolved: true
