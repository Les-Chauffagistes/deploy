route:
  group_by: ["alertname", "swarm_service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: discord

receivers:
  - name: discord
    # alertmanager-discord (core/alertmanager.yml) reformate le webhook
    # generique "slack" d'Alertmanager au format Discord.
    slack_configs:
      - api_url: http://alertmanager-discord:9094/slack
        send_resolved: true
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
