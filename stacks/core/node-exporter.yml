services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Désactivé par défaut (coût d'énumération de toutes les unités systemd) —
      # restreint à bitcoind.service pour n'exposer que ce qui nous intéresse,
      # sur tous les nœuds (mode: global) même ceux qui n'ont pas cette unité.
      - "--collector.systemd"
      - "--collector.systemd.unit-include=^bitcoind\\.service$$"
    volumes:
      - /:/host:ro,rslave
    networks:
      - chauffagistes-net
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
      restart_policy:
        condition: on-failure

networks:
  chauffagistes-net:
    external: true
