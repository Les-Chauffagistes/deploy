services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Désactivé par défaut (coût d'énumération de toutes les unités systemd) —
      # restreint à bitcoind.service et ckpool.service pour n'exposer que ce
      # qui nous intéresse, sur tous les nœuds (mode: global) même ceux qui
      # n'ont pas ces unités (toutes deux natives, hors Swarm, sur debian).
      - "--collector.systemd"
      - "--collector.systemd.unit-include=^(bitcoind|ckpool)\\.service$$"
    volumes:
      - /:/host:ro,rslave
      # Requis par --collector.systemd : il parle à systemd via D-Bus, pas via
      # /host. Chemin attendu en dur par node_exporter (godbus), pas configurable
      # par flag — il faut monter au même chemin dans le conteneur.
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    networks:
      - chauffagistes-net
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
      restart_policy:
        condition: on-failure

networks:
  chauffagistes-net:
    external: true
