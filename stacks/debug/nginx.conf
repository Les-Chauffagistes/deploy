worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # ──────────────────────────────────────────
  # Ajouter un bloc upstream + server par
  # service interne à débugger
  # ──────────────────────────────────────────

  upstream coins_service_staging {
    server coins-service_app:8095;
  }

  # upstream coins_service_prod {
  #   server coins-service_app:8095;  # si prod sur un port différent
  # }

  # upstream auth_service_staging {
  #   server auth-service_app:8086;
  # }

  server {
    listen 80;

    # coins-service staging
    location /staging/coins/ {
      rewrite ^/staging/coins/(.*) /$1 break;
      proxy_pass http://coins_service_staging;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Ajouter d'autres services ici au fur et à mesure
    # location /staging/auth/ {
    #   rewrite ^/staging/auth/(.*) /$1 break;
    #   proxy_pass http://auth_service_staging;
    # }

    # Healthcheck du proxy lui-même
    location /healthz {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}