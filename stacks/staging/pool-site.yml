services:
  app:
    image: 172.16.0.3:5000/pool-site:sha-74ccb99
    environment:
      NODE_ENV: staging
      DB_USER: pool_site
      DB_NAME: pool_site
      DB_HOST: pg-ha-staging_haproxy
      POOL_SERVICE_API_URL: https://api.staging.chauffagistes-btc.fr
      HOSTNAME: "0.0.0.0"
    secrets:
      - source: pool_site_staging_db_password
        target: db_password
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-staging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pool-site-staging.rule=Host(`staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.pool-site-staging.entrypoints=websecure"
        - "traefik.http.routers.pool-site-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.pool-site-staging.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-staging:
    external: true

secrets:
  pool_site_staging_db_password:
    external: true
