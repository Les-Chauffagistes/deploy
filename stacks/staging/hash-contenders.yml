services:
  app:
    image: 172.16.0.3:5000/hash-contenders:sha-262516f
    environment:
      HOSTNAME: 0.0.0.0
      API_URL: https://api.contenders.staging.chauffagistes-btc.fr
      WSS_URL: wss://api.contenders.staging.chauffagistes-btc.fr
      BASE_URL: https://contenders.staging.chauffagistes-btc.fr
      AUTH_API_URL: https://api.auth.staging.chauffagistes-btc.fr
      AUTH_URL: https://auth.staging.chauffagistes-btc.fr
      COINS_API_URL: http://coins-service-staging_app:8095
      BITCOIN_API_URL: https://bitcoin.staging.chauffagistes-btc.fr
      DB_USER: contenders
      DB_NAME: contenders
      DB_HOST: pg-ha-staging_haproxy
      BETS_CURRENCY: hashcoin
      TURNSTILE_SITE_KEY: 0x4AAAAAAEjE68rVZyl_GnoF
    secrets:
      - source: contenders_staging_db_password
        target: db_password
      - source: contenders_staging_coins_api_key
        target: coins_api_key
      - source: contenders_staging_jwt_secret
        target: jwt_secret
      - source: turnstile_secret_key
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-staging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.contenders-staging.rule=Host(`contenders.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.contenders-staging.entrypoints=websecure"
        - "traefik.http.routers.contenders-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.contenders-staging.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-staging:
    external: true

secrets:
  contenders_staging_db_password:
    external: true
  contenders_staging_coins_api_key:
    external: true
  contenders_staging_jwt_secret:
    external: true
  turnstile_secret_key:
    external: true