services:
  app:
    image: 10.10.0.3:5000/hash-contenders:sha-c86b13f
    environment:
      HOSTNAME: 0.0.0.0
      API_URL: https://api.contenders.staging.chauffagistes-btc.fr
      WSS_URL: wss://api.contenders.staging.chauffagistes-btc.fr
      BASE_URL: https://contenders.staging.chauffagistes-btc.fr
      AUTH_API_URL: https://api.auth.staging.chauffagistes-btc.fr
      AUTH_URL: https://auth.staging.chauffagistes-btc.fr
      COINS_API_URL: http://coins-service-staging_app:8095
      BITCOIN_API_URL: https://bitcoin.staging.chauffagistes-btc.fr
      DB_USER: postgres
      DB_NAME: chauffagistes
      DB_HOST: hash-contenders-staging_db
      BETS_CURRENCY: hashcoin
    secrets:
      - source: contenders_staging_db_password
        target: db_password
      - source: contenders_staging_coins_api_key
        target: coins_api_key
      - source: contenders_staging_jwt_secret
        target: jwt_secret
    volumes:
      - contenders-staging-migrations:/migrations
    networks:
      - chauffagistes-net
      - traefik-public
      - contenders-staging-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.contenders-staging.rule=Host(`contenders.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.contenders-staging.entrypoints=websecure"
        - "traefik.http.routers.contenders-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.contenders-staging.loadbalancer.server.port=3000"

  migrator:
    image: 10.10.0.3:5000/hash-contenders-migrator:sha-c86b13f
    environment:
      DB_HOST: hash-contenders-staging_db
      DB_USER: postgres
      DB_NAME: chauffagistes
    secrets:
      - source: contenders_staging_db_password
        target: db_password
    volumes:
      - contenders-staging-migrations:/migrations
    networks:
      - contenders-staging-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chauffagistes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: contenders_staging_db_password
        target: db_password
    volumes:
      - contenders-staging-db-data:/var/lib/postgresql/data
    networks:
      - contenders-staging-internal
      - contenders-staging-db-expose
    ports:
      - target: 5432
        published: 5434
        protocol: tcp
        mode: host
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  contenders-staging-db-data:
  contenders-staging-migrations:

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  contenders-staging-internal:
    driver: overlay
    internal: true
  contenders-staging-db-expose:
    driver: overlay

secrets:
  contenders_staging_db_password:
    external: true
  contenders_staging_coins_api_key:
    external: true
  contenders_staging_jwt_secret:
    external: true