services:
  app:
    image: 172.16.0.3:5000/hash-contenders-referee:sha-ab39634
    environment:
      SERVER_PORT: "8095"
      DB_USER: contenders_referee
      DB_HOST: pg-ha-staging_haproxy
      DB_NAME: contenders_referee
      API_URL: wss://api.staging.chauffagistes-btc.fr
      AUTH_API_URL: https://api.auth.staging.chauffagistes-btc.fr
      FRONTEND_URL: https://contenders.staging.chauffagistes-btc.fr
      POOL_API_URL: https://api.staging.chauffagistes-btc.fr
    secrets:
      - source: referee_staging_db_password
        target: db_password
      - source: referee_staging_api_token
        target: api_token
      - source: contenders_staging_jwt_secret
        target: jwt_secret
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-staging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: stop-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.referee-staging.rule=Host(`api.contenders.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.referee-staging.entrypoints=websecure"
        - "traefik.http.routers.referee-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.referee-staging.loadbalancer.server.port=8095"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-staging:
    external: true

secrets:
  referee_staging_db_password:
    external: true
  referee_staging_api_token:
    external: true
  contenders_staging_jwt_secret:
    external: true