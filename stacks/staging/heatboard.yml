services:
  app:
    image: 10.10.0.3:5000/heatboard:sha-260fb34
    environment:
      NODE_ENV: staging
      HOSTNAME: "0.0.0.0"
      PGHOST: db
      PGUSER: postgres
      PGPORT: "5432"
      PGDATABASE: chauffagistes
      DISCORD_CLIENT_ID: "1100450456091766907"
      DISCORD_REDIRECT_URI: https://heatboard.staging.chauffagistes-btc.fr/api/auth/discord/callback
      NEXTAUTH_URL: https://heatboard.staging.chauffagistes-btc.fr
      COOKIE_DOMAIN: .chauffagistes-btc.fr
      BASE_URL: https://heatboard.staging.chauffagistes-btc.fr
      API_URL: https://chauffagistes-pool.fr:3000
      HISTORY_API_URL: https://history.staging.chauffagistes-btc.fr
      BITCOIN_API_URL: https://bitcoin.staging.chauffagistes-btc.fr
      AUTH_URL: https://auth.staging.chauffagistes-btc.fr
      AUTH_API_URL: https://api.auth.staging.chauffagistes-btc.fr
    secrets:
      - source: heatboard_staging_db_password
        target: heatboard_db_password
      - source: heatboard_staging_pool_token
        target: heatboard_pool_token
      - source: heatboard_staging_session_password
        target: heatboard_session_password
      - source: discord_client_secret_staging
        target: heatboard_discord_client_secret
      - source: heatboard_staging_nextauth_secret
        target: heatboard_nextauth_secret
    volumes:
      - heatboard-staging-migrations:/migrations
    networks:
      - chauffagistes-net
      - traefik-public
      - heatboard-staging-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.heatboard-staging.rule=Host(`heatboard.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.heatboard-staging.entrypoints=websecure"
        - "traefik.http.routers.heatboard-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.heatboard-staging.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chauffagistes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/heatboard_db_password
    secrets:
      - source: heatboard_staging_db_password
        target: heatboard_db_password
    volumes:
      - heatboard-staging-db-data:/var/lib/postgresql/data
    networks:
      - heatboard-staging-internal
      - heatboard-staging-db-expose
    ports:
      - target: 5432
        published: 5433
        protocol: tcp
        mode: host
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  migrator:
    image: 10.10.0.3:5000/heatboard-migrator:sha-260fb34
    environment:
      DB_USER: postgres
      DB_HOST: db
      DB_NAME: chauffagistes
    secrets:
      - source: heatboard_staging_db_password
        target: db_password
    volumes:
      - heatboard-staging-migrations:/migrations
    networks:
      - heatboard-staging-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

volumes:
  heatboard-staging-db-data:
  heatboard-staging-migrations:

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  heatboard-staging-internal:
    driver: overlay
    internal: true
  heatboard-staging-db-expose:
    driver: overlay

secrets:
  heatboard_staging_db_password:
    external: true
  heatboard_staging_pool_token:
    external: true
  heatboard_staging_session_password:
    external: true
  discord_client_secret_staging:
    external: true
  heatboard_staging_nextauth_secret:
    external: true
