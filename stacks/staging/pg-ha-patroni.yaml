# Config Patroni commune à db1/db2 de pg-ha.yml. Les valeurs propres à chaque
# nœud (nom, adresses, scope, etcd, mots de passe) arrivent par variables
# d'environnement PATRONI_* (voir pg-ha.yml et pg-ha-entrypoint.sh).
restapi:
  listen: 0.0.0.0:8008

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    # Garde le primaire en écriture si etcd perd son quorum, tant qu'il voit
    # l'autre nœud Postgres.
    failsafe_mode: true
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        shared_preload_libraries: timescaledb,pg_stat_statements
        timescaledb.telemetry_level: "off"
        wal_level: replica
        archive_mode: "on"
        archive_timeout: 1800
        archive_command: barman-cloud-wal-archive --gzip --endpoint-url "$BARMAN_ENDPOINT" "$BARMAN_DEST" "$BARMAN_SERVER" %p
  initdb:
    - encoding: UTF8
    # C.UTF-8 : même ordre de tri que les anciennes db postgres:*-alpine (musl).
    - locale: C.UTF-8
    - data-checksums
  pg_hba:
    - local all all peer
    - host replication replicator all scram-sha-256
    - host all all all scram-sha-256

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /home/postgres/pgdata/data
  pgpass: /tmp/pgpass
  parameters:
    unix_socket_directories: /var/run/postgresql
    # Logs sur stderr pour qu'ils arrivent dans Loki.
    logging_collector: "off"

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
