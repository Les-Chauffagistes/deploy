# Cluster etcd partagé : DCS de tous les clusters Patroni (Postgres HA) de
# l'environnement, namespacé par le `scope` Patroni de chaque service (voir
# _templates/with-db-ha.staging.yml). 3 membres, un par nœud physique, pour
# garder le quorum si un nœud tombe.
#
# Sur chauffagistes-net pour être joignable depuis les autres stacks :
# exception assumée à "la db n'est jamais sur chauffagistes-net", etcd ne
# stocke aucune donnée métier.

x-etcd-common: &etcd-common
  image: gcr.io/etcd-development/etcd:v3.6.6
  networks:
    - chauffagistes-net
  # Pas de healthcheck : Swarm ne publie une tâche dans son DNS qu'une fois
  # healthy, or etcd n'est healthy qu'avec un quorum, qui exige que les pairs
  # se résolvent en DNS. Un healthcheck bloque donc le bootstrap (voir
  # CLAUDE.md). Surveillance via Prometheus (etcd_server_has_leader).

x-etcd-env: &etcd-env
  ETCD_INITIAL_CLUSTER: dcs1=http://etcd-dcs-staging_dcs1:2380,dcs2=http://etcd-dcs-staging_dcs2:2380,dcs3=http://etcd-dcs-staging_dcs3:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: etcd-dcs-staging-cluster
  ETCD_ENABLE_V2: "false"
  ETCD_DATA_DIR: /etcd-data
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379

x-etcd-deploy: &etcd-deploy
  replicas: 1
  endpoint_mode: dnsrr
  update_config:
    order: stop-first
  restart_policy:
    condition: any
    delay: 5s
  resources:
    limits:
      cpus: "0.5"
      memory: 512M

services:
  dcs1:
    <<: *etcd-common
    environment:
      <<: *etcd-env
      ETCD_NAME: dcs1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-dcs-staging_dcs1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-dcs-staging_dcs1:2379
    volumes:
      - etcd-dcs-staging-1-data:/etcd-data
    deploy:
      <<: *etcd-deploy
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo

  dcs2:
    <<: *etcd-common
    environment:
      <<: *etcd-env
      ETCD_NAME: dcs2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-dcs-staging_dcs2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-dcs-staging_dcs2:2379
    volumes:
      - etcd-dcs-staging-2-data:/etcd-data
    deploy:
      <<: *etcd-deploy
      placement:
        constraints:
          - node.labels.chauffagistes.host == vps

  dcs3:
    <<: *etcd-common
    environment:
      <<: *etcd-env
      ETCD_NAME: dcs3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-dcs-staging_dcs3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-dcs-staging_dcs3:2379
    volumes:
      - etcd-dcs-staging-3-data:/etcd-data
    deploy:
      <<: *etcd-deploy
      placement:
        constraints:
          - node.labels.chauffagistes.host == itrider

networks:
  chauffagistes-net:
    external: true

volumes:
  etcd-dcs-staging-1-data:
  etcd-dcs-staging-2-data:
  etcd-dcs-staging-3-data:
