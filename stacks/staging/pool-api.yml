services:
  app:
    image: 172.16.0.3:5000/pool-api:sha-02e921f
    environment:
      SERVER_PORT: "8080"
      PROMETHEUS_URL: "http://prometheus:9090"
      DB_HOST: pg-ha-staging_haproxy
      DB_NAME: ckpool
      DB_USER: ckpool
      REDIS_URL: redis://redis-ha-staging_haproxy:6379
    secrets:
      - source: pool_api_staging_api_key
        target: pool_api_password
      - source: ckpool_staging_db_password
        target: db_password
    networks:
      - chauffagistes-net
      - traefik-public
      - pg-staging
      - redis-staging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pool-api.rule=Host(`api.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.pool-api.entrypoints=websecure"
        - "traefik.http.routers.pool-api.tls.certresolver=letsencrypt"
        - "traefik.http.services.pool-api.loadbalancer.server.port=8080"

secrets:
  pool_api_staging_api_key:
    external: true
  ckpool_staging_db_password:
    external: true

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-staging:
    external: true
  redis-staging:
    external: true
