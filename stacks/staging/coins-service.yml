services:
  app:
    image: 172.16.0.3:5000/coins-service:sha-5cfe0f9
    environment:
      NODE_ENV: staging
      SERVER_PORT: "8095"
      DB_HOST: pg-ha-staging_haproxy
      DB_USER: coins_service
      DB_NAME: coins_service
      AUTH_SERVICE_URL: auth-service-back-staging_app:8080/auth
    secrets:
      - source: coins_staging_db_password
        target: db_password
      - source: coins_staging_api_key
        target: api_key
      - source: coins_staging_jwt_secret
        target: jwt_secret
    networks:
      - chauffagistes-net
      - pg-staging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      update_config:
        order: stop-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  chauffagistes-net:
    external: true
  pg-staging:
    external: true

secrets:
  coins_staging_db_password:
    external: true
  coins_staging_api_key:
    external: true
  coins_staging_jwt_secret:
    external: true