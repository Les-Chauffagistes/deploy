services:
  app:
    image: 10.10.0.3:5000/auth-service-back:sha-f5fc296
    # TEST TEMPORAIRE — override volontaire pour valider la detection de
    # crashloop post-convergence en conditions reelles (a retirer juste apres).
    # Sert /health correctement ~20s (le temps de passer N/N) puis crashe,
    # simule exactement le bug historique sans avoir besoin de pousser une
    # nouvelle image sur le registre prive.
    command:
      - python3
      - -c
      - "import http.server,time,sys\nclass H(http.server.BaseHTTPRequestHandler):\n def do_GET(s):\n  if s.path=='/health':\n   s.send_response(200); s.end_headers(); s.wfile.write(b'ok')\n  else:\n   s.send_response(404); s.end_headers()\n def log_message(s,*a): pass\nd=http.server.HTTPServer(('0.0.0.0',8080),H); d.timeout=1\nt=time.time()+20\nwhile time.time()<t: d.handle_request()\nsys.exit(1)\n"
    environment:
      SERVER_PORT: "8080"
      POSTGRES_DB: auth
      DISCORD_CLIENT_ID: "1100450456091766907"
      DISCORD_CALLBACK_URL: https://api.auth.staging.chauffagistes-btc.fr/discord/callback
      LIGHTNING_CALLBACK_URL: https://auth.staging.chauffagistes-btc.fr/lightning/callback
      DB_HOST: auth-service-back-staging_db
      DOMAIN_NAME: .chauffagistes-btc.fr
      ENVIRONMENT: staging
    secrets:
      - source: auth_staging_db_password
        target: db_password
      - source: discord_client_secret_staging
        target: discord_client_secret
      - source: auth_staging_jwt_secret
        target: jwt_secret
    networks:
      - traefik-public
      - chauffagistes-net
      - auth-staging-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      update_config:
        order: start-first
        monitor: 90s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.auth-staging.rule=Host(`api.auth.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.auth-staging.entrypoints=websecure"
        - "traefik.http.routers.auth-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.auth-staging.loadbalancer.server.port=8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: auth_staging_db_password
        target: db_password
    volumes:
      - auth-staging-db-data:/var/lib/postgresql/data
    networks:
      - auth-staging-internal
      - auth-staging-db-expose
    ports:
      - target: 5432
        published: 5436
        protocol: tcp
        mode: host
    stop_grace_period: 60s
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  auth-staging-db-data:

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  auth-staging-internal:
    driver: overlay
    internal: true
  auth-staging-db-expose:
    driver: overlay

secrets:
  auth_staging_db_password:
    external: true
  auth_staging_discord_client_id:
    external: true
  discord_client_secret_staging:
    external: true
  auth_staging_jwt_secret:
    external: true