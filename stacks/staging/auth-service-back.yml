services:
  api:
    image: 192.168.1.201:5000/auth-service-back:sha-2d4cfcb  # mis à jour manuellement
    environment:
      SERVER_PORT: "8080"
      POSTGRES_DB: auth
      DISCORD_CALLBACK_URL: https://auth.staging.swakraft.fr/auth/discord/callback
      LIGHTNING_CALLBACK_URL: https://auth.staging.swakraft.fr/auth/lightning/callback
      DB_HOST: auth-service_db
      DOMAIN_NAME: .swakraft.fr
    secrets:
      - source: auth_staging_db_password
        target: db_password
      - source: auth_staging_discord_client_id
        target: discord_client_id
      - source: auth_staging_discord_client_secret
        target: discord_client_secret
      - source: auth_staging_jwt_secret
        target: jwt_secret
    networks:
      - chauffagistes-net
      - auth-staging-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo  # à ajuster
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.auth-staging.rule=Host(`auth.staging.swakraft.fr`)"
        - "traefik.http.routers.auth-staging.entrypoints=websecure"
        - "traefik.http.routers.auth-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.auth-staging.loadbalancer.server.port=8080"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: auth_staging_db_password
        target: db_password
    volumes:
      - auth-staging-db-data:/var/lib/postgresql/data
    networks:
      - auth-staging-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo  # même nœud que l'api
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  auth-staging-db-data:

networks:
  chauffagistes-net:
    external: true
  auth-staging-internal:
    driver: overlay
    internal: true

secrets:
  auth_staging_db_password:
    external: true
  auth_staging_discord_client_id:
    external: true
  auth_staging_discord_client_secret:
    external: true
  auth_staging_jwt_secret:
    external: true