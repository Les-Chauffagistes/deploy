services:
  app:
    image: 10.10.0.3:5000/auth-service-back:sha-0834ade
    environment:
      SERVER_PORT: "8080"
      DISCORD_CLIENT_ID: "1100450456091766907"
      DISCORD_CALLBACK_URL: https://api.auth.staging.chauffagistes-btc.fr/discord/callback
      LIGHTNING_CALLBACK_URL: https://auth.staging.chauffagistes-btc.fr/lightning/callback
      DB_HOST: pg-ha-staging_haproxy
      DB_USER: auth_services
      DB_NAME: auth_services
      DOMAIN_NAME: .chauffagistes-btc.fr
      ENVIRONMENT: staging
    secrets:
      - source: auth_staging_db_password
        target: db_password
      - source: discord_client_secret_staging
        target: discord_client_secret
      - source: auth_staging_jwt_secret
        target: jwt_secret
    networks:
      - traefik-public
      - chauffagistes-net
      - pg-staging
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.workload == true
      update_config:
        order: stop-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.auth-staging.rule=Host(`api.auth.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.auth-staging.entrypoints=websecure"
        - "traefik.http.routers.auth-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.auth-staging.loadbalancer.server.port=8080"

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  pg-staging:
    external: true

secrets:
  auth_staging_db_password:
    external: true
  auth_staging_discord_client_id:
    external: true
  discord_client_secret_staging:
    external: true
  auth_staging_jwt_secret:
    external: true