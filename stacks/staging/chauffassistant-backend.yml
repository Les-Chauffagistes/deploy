# Image is built and published by ChauffAssistant/Cloud image; Deploy verifies publication.
x-chauffassistant-source-ref: "2238038c1bac543b837eff1cf7e22fef15441ffd"

services:
  app:
    image: 172.16.0.3:5000/chauffassistant-backend:sha-2238038
    environment:
      HTTP_ADDR: ":8080"
      CLOUD_STATE_DIR: /state
      CLOUD_PUBLIC_URL: https://api.chauffassistant.staging.chauffagistes-btc.fr
      AUTH_SERVICE_URL: http://auth-service-back-staging_app:8080
      AUTH_LOGIN_URL: https://auth.staging.chauffagistes-btc.fr/login
      GOMEMLIMIT: 192MiB
    volumes:
      - chauffassistant_cloud_state:/state
    read_only: true
    stop_grace_period: 15s
    networks:
      - traefik-public
      - chauffagistes-net
    healthcheck:
      test: ["CMD", "/cloud", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == vps
      update_config:
        order: stop-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 32M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.chauffassistant-backend-staging.rule=Host(`api.chauffassistant.staging.chauffagistes-btc.fr`) || Host(`chauffassistant-backend.staging.chauffagistes-btc.fr`)"
        - "traefik.http.routers.chauffassistant-backend-staging.entrypoints=websecure"
        - "traefik.http.routers.chauffassistant-backend-staging.tls.certresolver=letsencrypt"
        - "traefik.http.routers.chauffassistant-backend-staging.service=chauffassistant-backend-staging"
        - "traefik.http.services.chauffassistant-backend-staging.loadbalancer.server.port=8080"

networks:
  traefik-public:
    external: true
  chauffagistes-net:
    external: true

volumes:
  chauffassistant_cloud_state:
