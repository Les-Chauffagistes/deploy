# ============================================================
# TEMPLATE — Service avec PostgreSQL (PROD)
# Remplacer toutes les occurrences de MY_SERVICE / MY-SERVICE
# ============================================================

services:
  app:
    image: 10.10.0.3:5000/MY-SERVICE:0.0.0  # tag semver obligatoire en prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://MY_SERVICE:DOCKER-SECRET@MY-SERVICE-prod_db:5432/MY_SERVICE
    secrets:
      - source: MY_SERVICE_prod_db_password
        target: db_password
      - source: MY_SERVICE_prod_api_key
        target: api_key
    networks:
      - chauffagistes-net
      - MY-SERVICE-prod-internal
    deploy:
      replicas: 1
      update_config:
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1"
          memory: 512M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: MY_SERVICE
      POSTGRES_USER: MY_SERVICE
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: MY_SERVICE_prod_db_password
        target: db_password
    volumes:
      - MY-SERVICE-prod-db-data:/var/lib/postgresql/data
    networks:
      - MY-SERVICE-prod-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U MY_SERVICE"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo  # même nœud que l'api
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  MY-SERVICE-prod-db-data:

networks:
  chauffagistes-net:
    external: true
  MY-SERVICE-prod-internal:
    driver: overlay
    internal: true

secrets:
  MY_SERVICE_prod_db_password:
    external: true
  MY_SERVICE_prod_api_key:
    external: true
