# ============================================================
# TEMPLATE — Service avec PostgreSQL + exposition Traefik
# Remplacer MY-SERVICE (kebab-case) et MY_SERVICE (snake_case)
# ============================================================

services:
  app:
    image: 10.10.0.3:5000/MY-SERVICE:sha-0000000  # mis à jour manuellement
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://MY_SERVICE:DOCKER-SECRET@MY-SERVICE-staging_db:5432/MY_SERVICE
    secrets:
      - source: MY_SERVICE_staging_db_password
        target: db_password
      - source: MY_SERVICE_staging_api_key
        target: api_key
    networks:
      - chauffagistes-net
      - traefik-public
      - MY-SERVICE-staging-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo  # à ajuster
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.MY-SERVICE-staging.rule=Host(`MY-SERVICE.staging.${DOMAIN}`)"
        - "traefik.http.routers.MY-SERVICE-staging.entrypoints=websecure"
        - "traefik.http.routers.MY-SERVICE-staging.tls.certresolver=letsencrypt"
        - "traefik.http.services.MY-SERVICE-staging.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: MY_SERVICE
      POSTGRES_USER: MY_SERVICE
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: MY_SERVICE_staging_db_password
        target: db_password
    volumes:
      - MY-SERVICE-staging-db-data:/var/lib/postgresql/data
    networks:
      - MY-SERVICE-staging-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U MY_SERVICE"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo  # même nœud que l'api
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  MY-SERVICE-staging-db-data:

networks:
  chauffagistes-net:
    external: true
  traefik-public:
    external: true
  MY-SERVICE-staging-internal:
    driver: overlay
    internal: true

secrets:
  MY_SERVICE_staging_db_password:
    external: true
  MY_SERVICE_staging_api_key:
    external: true
