# ============================================================
# TEMPLATE — Service avec PostgreSQL en haute disponibilité
#
# 2 nœuds Patroni sur des nœuds physiques distincts + HAProxy devant, qui
# route toujours vers le primaire. DCS : cluster etcd partagé de
# l'environnement (stacks/staging/etcd-dcs.yml), qui doit déjà tourner.
# Préférer with-db.staging.yml si une coupure de la db pendant la panne d'un
# nœud est acceptable.
#
# Remplacer MY_SERVICE (snake_case) et MY-SERVICE (kebab-case), et copier
# with-db-ha-haproxy.cfg à côté du stack file sous le nom
# MY-SERVICE-haproxy.cfg (sans modification).
#
# Secret en plus de ceux de with-db.staging.yml :
#   printf "mot_de_passe_fort" | docker secret create MY_SERVICE_staging_db_replication_password -
# ============================================================

x-patroni-common: &patroni-common
  image: timescale/timescaledb-ha:pg17
  networks:
    - chauffagistes-net              # uniquement pour joindre etcd-dcs-staging
    - MY-SERVICE-staging-internal
  secrets:
    - source: MY_SERVICE_staging_db_password
      target: superuser_password
    - source: MY_SERVICE_staging_db_replication_password
      target: replication_password
  # Patroni ne lit pas les secrets Docker : on les exporte avant l'entrypoint.
  entrypoint:
    - sh
    - -c
    - >-
      export PATRONI_SUPERUSER_PASSWORD="$(cat /run/secrets/superuser_password)" &&
      export PATRONI_REPLICATION_PASSWORD="$(cat /run/secrets/replication_password)" &&
      exec /patroni_entrypoint.sh
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s

x-patroni-deploy: &patroni-deploy
  replicas: 1
  update_config:
    order: stop-first
  restart_policy:
    condition: any
    delay: 5s
  resources:
    limits:
      cpus: "0.5"
      memory: 512M

services:
  app:
    image: 10.10.0.3:5000/MY-SERVICE:sha-0000000  # mis à jour manuellement
    environment:
      NODE_ENV: staging
      DB_USER: MY_SERVICE
      DB_NAME: MY_SERVICE
      DB_HOST: haproxy
    secrets:
      - source: MY_SERVICE_staging_db_password
        target: db_password
      - source: MY_SERVICE_staging_api_key
        target: api_key
    networks:
      - chauffagistes-net
      - MY-SERVICE-staging-internal
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  db1:
    <<: *patroni-common
    hostname: db1
    environment:
      PATRONI_SUPERUSER_USERNAME: MY_SERVICE
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_CONFIGURATION: |
        scope: MY_SERVICE-staging
        name: db1
        restapi:
          listen: 0.0.0.0:8008
          connect_address: db1:8008
        etcd3:
          hosts: etcd-dcs-staging_dcs1:2379,etcd-dcs-staging_dcs2:2379,etcd-dcs-staging_dcs3:2379
        bootstrap:
          dcs:
            ttl: 30
            loop_wait: 10
            retry_timeout: 10
            maximum_lag_on_failover: 1048576
            postgresql:
              use_pg_rewind: true
          initdb:
            - encoding: UTF8
            - data-checksums
          pg_hba:
            - host replication replicator 0.0.0.0/0 md5
            - host all all 0.0.0.0/0 md5
          post_bootstrap: psql -c "CREATE DATABASE MY_SERVICE OWNER MY_SERVICE"
        postgresql:
          listen: 0.0.0.0:5432
          connect_address: db1:5432
          data_dir: /home/postgres/pgdata/data
          parameters:
            unix_socket_directories: '/var/run/postgresql'
        tags:
          nofailover: false
          noloadbalance: false
          clonefrom: false
          nosync: false
    volumes:
      - MY-SERVICE-staging-db1-data:/home/postgres
    deploy:
      <<: *patroni-deploy
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo

  db2:
    <<: *patroni-common
    hostname: db2
    environment:
      PATRONI_SUPERUSER_USERNAME: MY_SERVICE
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_CONFIGURATION: |
        scope: MY_SERVICE-staging
        name: db2
        restapi:
          listen: 0.0.0.0:8008
          connect_address: db2:8008
        etcd3:
          hosts: etcd-dcs-staging_dcs1:2379,etcd-dcs-staging_dcs2:2379,etcd-dcs-staging_dcs3:2379
        bootstrap:
          dcs:
            ttl: 30
            loop_wait: 10
            retry_timeout: 10
            maximum_lag_on_failover: 1048576
            postgresql:
              use_pg_rewind: true
          initdb:
            - encoding: UTF8
            - data-checksums
          pg_hba:
            - host replication replicator 0.0.0.0/0 md5
            - host all all 0.0.0.0/0 md5
          post_bootstrap: psql -c "CREATE DATABASE MY_SERVICE OWNER MY_SERVICE"
        postgresql:
          listen: 0.0.0.0:5432
          connect_address: db2:5432
          data_dir: /home/postgres/pgdata/data
          parameters:
            unix_socket_directories: '/var/run/postgresql'
        tags:
          nofailover: false
          noloadbalance: false
          clonefrom: false
          nosync: false
    volumes:
      - MY-SERVICE-staging-db2-data:/home/postgres
    deploy:
      <<: *patroni-deploy
      placement:
        constraints:
          - node.labels.chauffagistes.host == itrider

  haproxy:
    image: haproxy:2.9-alpine
    hostname: haproxy
    networks:
      - MY-SERVICE-staging-internal
    configs:
      - source: MY_SERVICE_staging_haproxy_cfg_v1
        target: /usr/local/etc/haproxy/haproxy.cfg
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

configs:
  # Configs Swarm immuables : incrémenter _vN à chaque changement du .cfg.
  MY_SERVICE_staging_haproxy_cfg_v1:
    file: ./MY-SERVICE-haproxy.cfg

volumes:
  MY-SERVICE-staging-db1-data:
  MY-SERVICE-staging-db2-data:

networks:
  chauffagistes-net:
    external: true
  MY-SERVICE-staging-internal:
    driver: overlay
    internal: true

secrets:
  MY_SERVICE_staging_db_password:
    external: true
  MY_SERVICE_staging_db_replication_password:
    external: true
  MY_SERVICE_staging_api_key:
    external: true
