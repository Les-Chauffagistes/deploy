# HAProxy en TCP devant les 2 nœuds Patroni. Le healthcheck HTTP sur l'API
# REST de Patroni (port 8008, /primary) ne répond 200 que sur le nœud
# actuellement primaire — HAProxy ne route donc jamais vers un replica.
#
# db1/db2 sont résolus par leur nom qualifié inter-stack (MY-SERVICE-prod_db1),
# pas par leur nom court. Constaté sur le cluster etcd (voir stacks/prod/etcd-dcs.yml) :
# un service Swarm attaché à plusieurs réseaux (ici chauffagistes-net + le
# réseau interne du service) n'a pas une résolution DNS fiable de son nom
# court pour les autres conteneurs qui le contactent — le nom qualifié, lui,
# résout de façon fiable quel que soit le nombre de réseaux. db1/db2 sont
# dans ce cas (chauffagistes-net pour atteindre etcd + réseau interne pour
# haproxy), donc ce fichier a besoin du remplacement MY-SERVICE comme le
# reste du template, contrairement à une version antérieure de ce fichier.
global
    maxconn 200

defaults
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen postgres
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db1 MY-SERVICE-prod_db1:5432 maxconn 100 check port 8008
    server db2 MY-SERVICE-prod_db2:5432 maxconn 100 check port 8008
