# HAProxy en TCP devant les 2 nœuds Patroni. Le healthcheck HTTP sur l'API
# REST de Patroni (port 8008, /primary) ne répond 200 que sur le nœud
# actuellement primaire — HAProxy ne route donc jamais vers un replica.
# Identique pour tous les services HA, aucune substitution MY-SERVICE
# nécessaire : les noms de service db1/db2 sont fixes dans le template.
global
    maxconn 200

defaults
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen postgres
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db1 db1:5432 maxconn 100 check port 8008
    server db2 db2:5432 maxconn 100 check port 8008
