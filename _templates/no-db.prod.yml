# ============================================================
# TEMPLATE — Service sans base de données (PROD)
# Remplacer MY-SERVICE par le nom en kebab-case
# ============================================================

services:
  app:
    image: ghcr.io/chauffagistes/MY-SERVICE:0.0.0  # tag semver obligatoire en prod
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_API_URL: https://mon-domaine.com
    secrets:
      - source: MY_SERVICE_prod_api_key
        target: api_key
    networks:
      - chauffagistes-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.chauffagistes.host == hugo  # à ajuster selon la répartition
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.MY-SERVICE-prod.rule=Host(`MY-SERVICE.${DOMAIN}`)"
        - "traefik.http.routers.MY-SERVICE-prod.entrypoints=websecure"
        - "traefik.http.routers.MY-SERVICE-prod.tls.certresolver=letsencrypt"
        - "traefik.http.services.MY-SERVICE-prod.loadbalancer.server.port=3000"

networks:
  chauffagistes-net:
    external: true

secrets:
  MY_SERVICE_prod_api_key:
    external: true
