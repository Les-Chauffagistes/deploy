name: Debug — Service logs

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Nom du service Swarm (ex: heatboard-staging_app)"
        required: true
        type: string
      tail:
        description: Nombre de lignes
        required: false
        default: "200"
        type: string

jobs:
  logs:
    runs-on: [self-hosted, manager]
    steps:
      - name: Service ps
        run: docker service ps "${{ inputs.service }}" --no-trunc

      - name: Service logs
        run: docker service logs "${{ inputs.service }}" --tail "${{ inputs.tail }}" --timestamps 2>&1 || true
