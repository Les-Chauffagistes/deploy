name: Deploy

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '_templates/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Redéployer tous les stacks de l'environnement sélectionné
        required: true
        default: false
        type: boolean

jobs:
  # ─────────────────────────────────────────────
  # Détection des changements du push par dossier
  # ─────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: [self-hosted, manager]
    outputs:
      staging: ${{ steps.filter.outputs.staging }}
      prod:    ${{ steps.filter.outputs.prod }}
      core:    ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Compare au commit précédent de la branche poussée, pas à la
          # branche par défaut. main et develop peuvent être identiques
          # après une promotion en production.
          base: ${{ github.ref }}
          filters: |
            staging:
              - 'stacks/staging/**'
            prod:
              - 'stacks/prod/**'
            core:
              - 'stacks/core/**'

  # ─────────────────────────────────────────────
  # Guard — vérifie que les images prod sont
  # toutes taguées en semver, jamais en SHA
  # Sur main si stacks/prod a changé ou lors d'un redéploiement forcé
  # ─────────────────────────────────────────────
  guard-prod-images:
    name: Guard — no SHA in prod
    runs-on: [self-hosted, manager]
    needs: [changes]
    if: |
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.prod == 'true' || inputs.force_deploy)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download yq
        id: yq
        run: |
          YQ_PATH="$RUNNER_TEMP/yq"
          wget -qO "$YQ_PATH" \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod 755 "$YQ_PATH"
          echo "path=$YQ_PATH" >> "$GITHUB_OUTPUT"

      - name: Vérifier que toutes les images prod sont versionnées
        env:
          YQ: ${{ steps.yq.outputs.path }}
        run: |
          FAILED=0
          for file in stacks/prod/*.yml; do
            while IFS= read -r image; do
              [[ -z "$image" || "$image" == "null" ]] && continue
              if [[ "$image" =~ :sha- ]] || [[ "$image" =~ :branch- ]]; then
                echo "❌ Image non versionnée dans $file : $image"
                FAILED=1
              fi
            done < <("$YQ" e '.services[].image' "$file")
          done
          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "Les images en prod doivent porter un tag semver (ex: 1.2.3)."
            echo "Pose un tag sur le repo du service et mets à jour le stack file."
            exit 1
          fi
          echo "✅ Toutes les images prod sont versionnées"

  # ─────────────────────────────────────────────
  # Deploy
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    runs-on: [self-hosted, manager]
    needs: [changes, guard-prod-images]
    # Déployer si :
    # - guard skippé (pas de changement prod ou branche develop) ou guard passé
    # - ET au moins un dossier a changé, ou le déclenchement est forcé
    if: |
      always() &&
      (needs.guard-prod-images.result == 'success' || needs.guard-prod-images.result == 'skipped') &&
      (inputs.force_deploy || needs.changes.outputs.core == 'true' || needs.changes.outputs.staging == 'true' || needs.changes.outputs.prod == 'true')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy core stack
        if: inputs.force_deploy || needs.changes.outputs.core == 'true'
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMPOSE_ARGS=""
          for file in stacks/core/*.yml; do
            COMPOSE_ARGS="$COMPOSE_ARGS -c $file"
          done
          docker stack deploy $COMPOSE_ARGS \
            --with-registry-auth \
            --prune \
            core

      - name: Deploy services
        if: |
          inputs.force_deploy ||
          (github.ref == 'refs/heads/develop' && needs.changes.outputs.staging == 'true') ||
          (github.ref == 'refs/heads/main'    && needs.changes.outputs.prod    == 'true')
        run: |
          ENV=${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          for file in stacks/${ENV}/*.yml; do
            stack="$(basename "$file" .yml)-${ENV}"
            echo "Deploying $stack..."
            docker stack deploy \
              -c "$file" \
              --with-registry-auth \
              --prune \
              "$stack"
          done

      - name: Verify convergence
        if: |
          inputs.force_deploy ||
          needs.changes.outputs.core == 'true' ||
          (github.ref == 'refs/heads/develop' && needs.changes.outputs.staging == 'true') ||
          (github.ref == 'refs/heads/main'    && needs.changes.outputs.prod    == 'true')
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          verify_stack() {
            local NAMESPACE=$1
            local TIMEOUT=${2:-120}
            local INTERVAL=5
            local ELAPSED=0

            echo "── Vérification stack: $NAMESPACE (timeout ${TIMEOUT}s)"

            while [ $ELAPSED -lt $TIMEOUT ]; do
              FAILING=$(docker service ls \
                --filter "label=com.docker.stack.namespace=${NAMESPACE}" \
                --format "{{.Name}} {{.Replicas}}" \
                | while read -r name replicas; do
                    echo "$name" | grep -q "_migrator" && continue
                    current=$(echo "$replicas" | cut -d'/' -f1)
                    target=$(echo "$replicas" | cut -d'/' -f2)
                    [ "$current" != "$target" ] && echo "$name"
                  done)

              if [ -z "$FAILING" ]; then
                echo "✅ $NAMESPACE convergé"
                return 0
              fi

              echo "  En attente : $FAILING ($ELAPSED/${TIMEOUT}s)"
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            done

            echo "❌ Timeout — services non convergés dans $NAMESPACE :"
            docker stack ps "$NAMESPACE" --no-trunc | grep -v "Running"
            return 1
          }

          FAILED=0
          ENV=${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

          if [[ "$FORCE_DEPLOY" == "true" || "${{ needs.changes.outputs.core }}" == "true" ]]; then
            verify_stack "core" 180 || FAILED=1
          fi

          if [[ "$FORCE_DEPLOY" == "true" ]] || \
             [[ "${{ needs.changes.outputs.staging }}" == "true" && "${{ github.ref }}" == "refs/heads/develop" ]] || \
             [[ "${{ needs.changes.outputs.prod }}"    == "true" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            for file in stacks/${ENV}/*.yml; do
              stack="$(basename "$file" .yml)-${ENV}"
              verify_stack "$stack" 120 || FAILED=1
            done
          fi

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Un ou plusieurs stacks n'ont pas convergé"
            docker service ls
            exit 1
          fi

          echo ""
          echo "✅ Tous les stacks sont convergés"
          docker service ls

      - name: Tag deployed commits
        if: |
          inputs.force_deploy ||
          (github.ref == 'refs/heads/develop' && needs.changes.outputs.staging == 'true') ||
          (github.ref == 'refs/heads/main'    && needs.changes.outputs.prod    == 'true')
        env:
          ORG_PAT: ${{ secrets.ORG_PAT }}
        run: |
          YQ="$RUNNER_TEMP/yq"
          wget -qO "$YQ" \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod 755 "$YQ"

          ENV=${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
          GIT_TAG=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          ORG="les-chauffagistes"
          API="https://api.github.com"

          set_tag() {
            local repo=$1 sha=$2 tag=$3 status

            status=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: token ${ORG_PAT}" \
              -H "Content-Type: application/json" \
              "${API}/repos/${ORG}/${repo}/git/refs/tags/${tag}" \
              -d "{\"sha\":\"${sha}\",\"force\":true}")

            if [[ "$status" != "200" ]]; then
              status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: token ${ORG_PAT}" \
                -H "Content-Type: application/json" \
                "${API}/repos/${ORG}/${repo}/git/refs" \
                -d "{\"ref\":\"refs/tags/${tag}\",\"sha\":\"${sha}\"}")
              if [[ "$status" != "201" ]]; then
                echo "❌ Échec du tag pour ${repo} (HTTP ${status})"
                return 1
              fi
            fi
          }

          for file in stacks/${ENV}/*.yml; do
            service="$(basename "$file" .yml)"
            IMAGE_TAG=$("$YQ" e '.services.app.image // ""' "$file" | awk -F: '{print $NF}')
            [[ -z "$IMAGE_TAG" || "$IMAGE_TAG" == "null" ]] && continue

            REF=$([[ "$ENV" == "staging" ]] && echo "${IMAGE_TAG#sha-}" || echo "v${IMAGE_TAG}")

            FULL_SHA=$(curl -s \
              -H "Authorization: token ${ORG_PAT}" \
              "${API}/repos/${ORG}/${service}/commits/${REF}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])" 2>/dev/null) || true

            if [[ -z "$FULL_SHA" || "$FULL_SHA" == "null" ]]; then
              echo "⚠️ Commit introuvable pour ${service}@${REF}, skipping"
              continue
            fi

            echo "→ ${service} : tag ${GIT_TAG} → ${FULL_SHA}"
            set_tag "$service" "$FULL_SHA" "$GIT_TAG"
          done