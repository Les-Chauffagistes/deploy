name: Deploy

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-core:
    name: Deploy core (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    runs-on: self-hosted
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy core stack
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
        run: |
          docker stack deploy \
            -c stacks/core/traefik.yml \
            --with-registry-auth \
            --detach=false \
            core
