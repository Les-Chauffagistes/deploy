name: Inspect ChauffAssistant CI
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: [.github/workflows/inspect-chauffassistant-ci.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    container: python:3.13-slim
    timeout-minutes: 20
    steps:
      - name: Read source CI failure metadata
        env:
          ORG_PAT: ${{ secrets.ORG_PAT }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = 'https://api.github.com/repos/Les-Chauffagistes/ChauffAssistant'
          def get(path):
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + os.environ['ORG_PAT'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          def notice(message):
              print('::notice::' + str(message).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          # Metadata only: never download or publish private job logs.
          # Use a hosted runner so monitoring cannot occupy a runner needed by CI.
          deadline = time.monotonic() + 1000
          while True:
              runs = get('/actions/workflows/ci.yml/runs?branch=main&per_page=1')['workflow_runs']
              run = runs[0]
              if run['status'] == 'completed' or time.monotonic() >= deadline:
                  break
              time.sleep(20)
          for run in runs:
              notice(str(run['id']) + ' ' + run['head_sha'] + ' ' + run['status'] + ' ' + str(run['conclusion']))
              for job in get('/actions/runs/' + str(run['id']) + '/jobs')['jobs']:
                  notice(job['name'] + ': ' + str(job['conclusion']))
                  if job['conclusion'] == 'failure':
                      for step in job.get('steps', []):
                          if step['conclusion'] == 'failure':
                              notice('Failed step: ' + step['name'])
          if run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit('Source CI did not succeed; see step metadata above.')
          PY
