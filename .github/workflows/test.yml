name: Reusable — Python tests

on:
  workflow_call:
    inputs:
      python-version:
        description: "Version Python"
        required: false
        type: string
        default: "3.13"

jobs:
  test:
    name: Python test suite
    runs-on: [self-hosted, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ./requirements.txt

      - name: Ensure Docker access (for Testcontainers)
        run: docker info > /dev/null

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest