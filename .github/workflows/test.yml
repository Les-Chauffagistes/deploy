name: Reusable — Python tests

on:
  workflow_call:
    inputs:
      python-version:
        description: "Version Python"
        required: false
        type: string
        default: "3.13"

jobs:
  test:
    name: Python test suite
    runs-on: [self-hosted, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python via uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/requirements.txt"

      - name: Ensure Docker access (for Testcontainers)
        run: docker info > /dev/null

      - name: Configure private pip index (chauff-cmn)
        run: echo "UV_EXTRA_INDEX_URL=http://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@10.10.0.3:8081/simple/" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Generate Prisma client
        if: ${{ hashFiles('**/schema.prisma') != '' }}
        run: uv run prisma generate

      - name: Run pytest
        run: uv run pytest