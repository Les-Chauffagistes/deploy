name: Configure ChauffAssistant registry

on:
  # Bootstrap once; switch to manual-only after the authorised setup succeeds.
  push:
    branches: [develop]
    paths: ['.github/workflows/sync-chauffassistant-registry.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chauffassistant-registry-setup
  cancel-in-progress: false

jobs:
  configure:
    name: Configure source secrets and verify its build
    runs-on: [self-hosted, manager]
    environment: staging
    container: python:3.13-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install sealed-box support (without secret environment)
        run: python -m pip install --no-cache-dir PyNaCl==1.6.2
      - name: Test authorised secret scope and encryption with dummy values
        run: python .github/scripts/test-sync-chauffassistant-registry.py
      - name: Copy only the two authorised registry secrets
        env:
          ORG_PAT: ${{ secrets.ORG_PAT }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: python .github/scripts/sync-chauffassistant-registry.py sync
      - name: Dispatch the separate source build
        id: source
        env:
          ORG_PAT: ${{ secrets.ORG_PAT }}
        run: python .github/scripts/sync-chauffassistant-registry.py dispatch
      - name: Verify source image publication
        env:
          ORG_PAT: ${{ secrets.ORG_PAT }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: python .github/scripts/wait-chauffassistant-build.py
      - name: Restore runner ownership
        if: always()
        run: chown -hR --reference="$RUNNER_TEMP" "$GITHUB_WORKSPACE"
