name: Reusable — Build & Push

on:
  workflow_call:
    inputs:
      service-name:
        description: "Nom du service"
        required: true
        type: string
      build-target:
        description: "Stage Docker cible (ex: runner, migrator). Vide = image complète"
        required: false
        type: string
        default: ""
      build-args:
        required: false
        type: string
        default: ""
    secrets:
      REGISTRY_USER:
        required: true
      REGISTRY_PASSWORD:
        required: true
      ORG_PAT:
        required: true

env:
  REGISTRY: 10.10.0.3:5000

jobs:
  build-push:
    name: Build & Push ${{ inputs.service-name }}${{ inputs.build-target != '' && format(' ({0})', inputs.build-target) || '' }}
    runs-on: [ self-hosted, worker ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug env
        run: |
          whoami
          echo "$PATH"
          env | sort

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.service-name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch,prefix=branch-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Verdaccio (@chauffagistes/*, npm) n'accepte pas un token statique comme le
      # pypiserver ou GitHub Packages : il faut échanger user/password contre un
      # token de session à chaque run (même mécanique que release.yml de chauff-cmn).
      - name: Get verdaccio auth token
        id: verdaccio-auth
        run: |
          TOKEN=$(curl -s -u "${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}" \
            -X PUT "http://10.10.0.3:4873/-/user/org.couchdb.user:${{ secrets.REGISTRY_USER }}" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"${{ secrets.REGISTRY_USER }}\",\"password\":\"${{ secrets.REGISTRY_PASSWORD }}\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ] || [ "$TOKEN" = "undefined" ]; then
            echo "Échec de l'authentification Verdaccio : pas de token reçu"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # .npmrc a besoin de plusieurs lignes (GitHub Packages + verdaccio) : le champ
      # `secrets:` de build-push-action ne supporte qu'une valeur par ligne, donc on
      # passe par un fichier + `secret-files:` pour le secret "npmrc".
      - name: Write CI .npmrc
        run: |
          cat > "$RUNNER_TEMP/ci.npmrc" <<EOF
          //npm.pkg.github.com/:_authToken=${{ secrets.ORG_PAT }}
          @chauffagistes:registry=http://10.10.0.3:4873/
          //10.10.0.3:4873/:_authToken=${{ steps.verdaccio-auth.outputs.token }}
          //10.10.0.3:4873/:always-auth=true
          EOF

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: ${{ inputs.build-target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            pipindex=http://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@10.10.0.3:8081/simple/
          secret-files: |
            npmrc=${{ runner.temp }}/ci.npmrc

      - name: Summary
        run: |
          echo "### Image(s) publiée(s) 🐳" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY